name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Blazor Application
        run: |
          # Находит csproj автоматически в любой папке
          PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
          echo "Found project: $PROJECT_FILE"
          dotnet publish "$PROJECT_FILE" -c Release -o release --nologo

      - name: Configure for GitHub Pages (Base Href & 404)
        run: |
          # 1. Заменяем <base href="/" /> на <base href="/UnityPortfolio/" />
          sed -i 's|<base href="/" />|<base href="/UnityPortfolio/" />|g' release/wwwroot/index.html
          
          # 2. Создаем .nojekyll (чтобы GitHub не игнорировал папку _framework с WebAssembly)
          touch release/wwwroot/.nojekyll
          
          # 3. Копируем index.html в 404.html (чтобы работало обновление страницы F5)
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4