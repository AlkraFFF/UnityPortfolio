name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore UnityPortfolio/UnityPortfolio.csproj

      - name: Publish Blazor WebAssembly Application
        run: |
          dotnet publish UnityPortfolio/UnityPortfolio.csproj \
            -c Release \
            -o release --nologo

      - name: Rewrite <base href> for GitHub Pages Subdirectory Hosting
        run: |
          # Grabs repository name (e.g., 'portfolio') to form base href '/portfolio/'
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i 's|<base href="/" />|<base href="/'${REPO_NAME}'/" />|g' release/wwwroot/index.html

      - name: Create .nojekyll and SPA 404 Fallback
        run: |
          # Prevent GitHub Pages from ignoring _framework folder
          touch release/wwwroot/.nojekyll
          # Copy index.html to 404.html to resolve deep-link refreshes
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4