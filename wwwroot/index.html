<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unity & C# Developer Portfolio</title>

    <!-- Базовый путь для локальной разработки -->
    <base href="/" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data: https:; 
                   connect-src 'self' ws: wss:;" />

    <!-- Подключение ваших стилей -->
    <link rel="stylesheet" href="css/app.css" />
</head>


<body>
<!-- Точка монтирования Blazor приложения -->
<div id="app">
    <div style="display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; background: #0a0b10; color: #00f0ff; font-family: monospace;">
        <div style="font-size: 1.5rem; margin-bottom: 1rem; font-weight: bold;">[ SYSTEM INITIALIZING ]</div>
        <div style="color: #94a3b8; font-size: 0.9rem;">Loading WebAssembly Runtime & Engine Assets...</div>
    </div>
</div>

<div id="blazor-error-ui" style="display:none; position: fixed; bottom: 0; width: 100%; background: #ff4444; color: white; padding: 10px; text-align: center;">
    An unhandled error has occurred.
    <a href="" class="reload" style="color: yellow; margin-left: 10px;">Reload</a>
</div>

<!-- Главный скрипт загрузчика .NET 9 WebAssembly -->
<script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
